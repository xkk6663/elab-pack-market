name: debug-hash

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout elab kernel
        uses: actions/checkout@v4
        with:
          repository: xkk6663/elab-flow
          path: .elab-src

      - name: Hash pack on runner
        env:
          PYTHONPATH: ${{ github.workspace }}/.elab-src/services
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from elab import pkg

          url = "https://github.com/xkk6663/elab-pack-artery-at32.git"
          ref = "20eaa90c1ae9b1cfbfa3d84c2b69b1de47978c2d"
          with pkg._materialize(git=url, ref=ref) as (d, origin):
              root = Path(d)
              print("ROOT", root)
              print("TREE_HASH", pkg.tree_hash(root))
              for p in sorted(root.rglob("*")):
                  if not p.is_file():
                      continue
                  rel = p.relative_to(root).as_posix()
                  if any(part in (".git",) for part in Path(rel).parts):
                      continue
                  data = p.read_bytes()
                  print("FILE", rel, len(data), hashlib.sha256(data).hexdigest(),
                        "CRLF" if b"\r\n" in data else "LF")
              for p in sorted(root.rglob("*")):
                  if not p.is_file():
                      continue
                  rel = p.relative_to(root).as_posix()
                  if any(part in (".git",) for part in Path(rel).parts):
                      continue
                  print("HEX", rel, p.read_bytes().hex())
          PY
